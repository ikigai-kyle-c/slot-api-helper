<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Test Console</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>API Test Console</h1>
          <p>Internal maintenance and RGS play flow runner</p>
        </div>
        <div id="status" class="status">Idle</div>
      </header>

      <nav class="tabs" aria-label="Flow tabs">
        <button class="tab is-active" data-tab="bet" type="button">RGS Bet</button>
        <button class="tab" data-tab="lobby" type="button">RGS Lobby</button>
        <button class="tab" data-tab="maintenance" type="button">Maintenance</button>
      </nav>

      <section id="bet-panel" class="panel is-active">
        <form id="bet-form" class="control-grid">
          <label>
            API domain
            <input name="apiDomain" autocomplete="off">
          </label>
          <label>
            Signature
            <input name="signature" autocomplete="off">
          </label>
          <label>
            Game code
            <input name="gameCode" autocomplete="off">
          </label>
          <label class="json-field">
            Session start headers JSON
            <textarea name="sessionStartHeadersJson" placeholder='{"x-signature":"rgs-local-signature"}'></textarea>
          </label>
          <label class="json-field">
            Session start body JSON
            <textarea name="sessionStartBodyJson" placeholder='{"gameCode":"LGS-006","lang":"en"}'></textarea>
          </label>
          <label class="json-field">
            Session activate headers JSON
            <textarea name="sessionActivateHeadersJson" placeholder='{"content-type":"application/json"}'></textarea>
          </label>
          <label class="json-field">
            Session activate body JSON
            <textarea name="sessionActivateBodyJson" placeholder='{"token":"...","ts":0}'></textarea>
          </label>
          <label class="json-field">
            Bet headers JSON
            <textarea name="betHeadersJson" placeholder='{"cloudfront-viewer-country":"JP"}'></textarea>
          </label>
          <label class="json-field">
            Bet body JSON
            <textarea name="betBodyJson" placeholder='{"session":"...","bet":{"type":"regular","value":"2"}}'></textarea>
          </label>
          <label class="json-field">
            Action headers JSON
            <textarea name="actionHeadersJson" placeholder='{"cloudfront-viewer-country":"JP"}'></textarea>
          </label>
          <label class="json-field">
            Action body JSON
            <textarea name="actionBodyJson" placeholder='{"session":"...","roundId":"...","action":1,"ts":0}'></textarea>
          </label>
          <label class="json-field">
            Finish headers JSON
            <textarea name="finishHeadersJson" placeholder='{"cloudfront-viewer-country":"JP"}'></textarea>
          </label>
          <label class="json-field">
            Finish body JSON
            <textarea name="finishBodyJson" placeholder='{"session":"...","roundId":"...","ts":0}'></textarea>
          </label>
          <button class="primary" type="submit">Run Bet Flow</button>
        </form>
      </section>

      <section id="lobby-panel" class="panel">
        <form id="lobby-form" class="control-grid">
          <label>
            API domain
            <input name="apiDomain" autocomplete="off">
          </label>
          <label>
            Signature
            <input name="signature" autocomplete="off">
          </label>
          <label>
            Game code
            <input name="gameCode" autocomplete="off">
          </label>
          <label class="json-field">
            Session start headers JSON
            <textarea name="sessionStartHeadersJson" placeholder='{"x-signature":"rgs-local-signature"}'></textarea>
          </label>
          <label class="json-field">
            Session start body JSON
            <textarea name="sessionStartBodyJson" placeholder='{"gameCode":"LGS-006","lang":"en"}'></textarea>
          </label>
          <label class="json-field">
            Session activate headers JSON
            <textarea name="sessionActivateHeadersJson" placeholder='{"content-type":"application/json"}'></textarea>
          </label>
          <label class="json-field">
            Session activate body JSON
            <textarea name="sessionActivateBodyJson" placeholder='{"token":"...","ts":0}'></textarea>
          </label>
          <label class="json-field">
            Token activate headers JSON
            <textarea name="tokenActivateHeadersJson" placeholder='{"authorization":"Bearer ..."}'></textarea>
          </label>
          <label class="json-field">
            Token activate body JSON
            <textarea name="tokenActivateBodyJson" placeholder='{}'></textarea>
          </label>
          <label class="json-field">
            Token refresh headers JSON
            <textarea name="tokenRefreshHeadersJson" placeholder='{"authorization":"Bearer ..."}'></textarea>
          </label>
          <label class="json-field">
            Token refresh body JSON
            <textarea name="tokenRefreshBodyJson" placeholder='{"refreshToken":"..."}'></textarea>
          </label>
          <button class="primary" type="submit">Run Lobby Flow</button>
        </form>
      </section>

      <section id="maintenance-panel" class="panel">
        <form id="maintenance-form" class="control-grid maintenance-grid">
          <label>
            API domain
            <input name="apiDomain" autocomplete="off">
          </label>
          <label>
            Signature
            <input name="signature" autocomplete="off">
          </label>
          <label>
            User ID
            <input name="userId" autocomplete="off">
          </label>
          <label>
            Account
            <input name="account" autocomplete="off">
          </label>
          <label>
            Code
            <input name="code" autocomplete="off">
          </label>
          <label>
            Route key
            <input name="routeKey" autocomplete="off">
          </label>
          <label>
            Game code
            <input name="gameCode" autocomplete="off">
          </label>
          <label class="toggle-row">
            <span>Maintenance</span>
            <input name="isMaintenance" type="checkbox">
          </label>
          <label class="json-field">
            AM token headers JSON
            <textarea name="amTokenHeadersJson" placeholder='{"x-signature":"rgs-local-signature"}'></textarea>
          </label>
          <label class="json-field">
            AM token body JSON
            <textarea name="amTokenBodyJson" placeholder='{"userId":0,"account":"kyle.c","code":"SLT","permission":[{"routeKey":"V1_INTERNAL_GAME_MAINTENANCE","methods":["GET","POST","PUT","PATCH","DELETE","*"]}]}'></textarea>
          </label>
          <label class="json-field">
            Maintenance headers JSON
            <textarea name="maintenanceHeadersJson" placeholder='{"accept":"application/json"}'></textarea>
          </label>
          <label class="json-field">
            Maintenance body JSON
            <textarea name="maintenanceBodyJson" placeholder='{"isMaintenance":true}'></textarea>
          </label>
          <button class="primary" type="submit">Run Maintenance</button>
        </form>
      </section>

      <section class="workspace">
        <div class="output-panel">
          <div class="section-title">
            <h2>Result</h2>
            <span id="result-file"></span>
          </div>
          <pre id="result-output">{}</pre>
        </div>
        <div class="output-panel">
          <div class="section-title">
            <h2>Trace</h2>
          </div>
          <pre id="trace-output">[]</pre>
        </div>
      </section>

      <section class="records-panel">
        <div class="section-title">
          <h2>Recent Records</h2>
          <span>Latest 10</span>
        </div>
        <div id="records-list" class="records-list"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
