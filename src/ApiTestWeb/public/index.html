<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slot API Test Console</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>API Test Console</h1>
          <p>Internal maintenance and RGS play flow runner</p>
        </div>
        <div id="status" class="status badge idle">Idle</div>
      </header>

      <nav class="tabs" aria-label="Flow tabs">
        <button class="tab is-active" data-tab="bet" type="button">RGS Bet Flow</button>
        <button class="tab" data-tab="lobby" type="button">RGS Lobby Flow</button>
        <button class="tab" data-tab="maintenance" type="button">Maintenance Control</button>
      </nav>

      <div class="content-layout">
        <div class="controls-column">
          <section id="bet-panel" class="panel is-active">
            <form id="bet-form" class="flow-form">
              <div class="card">
                <h3>Target Environment</h3>
                <div class="control-grid">
                  <label>API domain <input name="apiDomain" autocomplete="off"></label>
                  <label>Signature <input name="signature" autocomplete="off"></label>
                  <label>Game code <input name="gameCode" autocomplete="off"></label>
                </div>
              </div>
              <div class="card">
                <h3>Payloads & Headers</h3>
                <div class="control-grid json-grid">
                  <label class="json-field">Session Start Headers <textarea name="sessionStartHeadersJson"></textarea></label>
                  <label class="json-field">Session Start Body <textarea name="sessionStartBodyJson"></textarea></label>
                  <label class="json-field">Activate Headers <textarea name="sessionActivateHeadersJson"></textarea></label>
                  <label class="json-field">Activate Body <textarea name="sessionActivateBodyJson"></textarea></label>
                  <label class="json-field">Bet Headers <textarea name="betHeadersJson"></textarea></label>
                  <label class="json-field">Bet Body <textarea name="betBodyJson"></textarea></label>
                  <label class="json-field">Action Headers <textarea name="actionHeadersJson"></textarea></label>
                  <label class="json-field">Action Body <textarea name="actionBodyJson"></textarea></label>
                  <label class="json-field">Finish Headers <textarea name="finishHeadersJson"></textarea></label>
                  <label class="json-field">Finish Body <textarea name="finishBodyJson"></textarea></label>
                </div>
              </div>
              <div class="form-actions">
                <button class="primary btn-large" type="submit">🚀 Execute Bet Flow</button>
              </div>
            </form>
          </section>

          <section id="lobby-panel" class="panel">
            <form id="lobby-form" class="flow-form">
              <div class="card">
                <h3>Target Environment</h3>
                <div class="control-grid">
                  <label>API domain <input name="apiDomain" autocomplete="off"></label>
                  <label>Signature <input name="signature" autocomplete="off"></label>
                  <label>Game code <input name="gameCode" autocomplete="off"></label>
                </div>
              </div>
              <div class="card">
                <h3>Payloads & Headers</h3>
                <div class="control-grid json-grid">
                  <label class="json-field">Session Start Headers <textarea name="sessionStartHeadersJson"></textarea></label>
                  <label class="json-field">Session Start Body <textarea name="sessionStartBodyJson"></textarea></label>
                  <label class="json-field">Activate Headers <textarea name="sessionActivateHeadersJson"></textarea></label>
                  <label class="json-field">Activate Body <textarea name="sessionActivateBodyJson"></textarea></label>
                  <label class="json-field">Token Activate Headers <textarea name="tokenActivateHeadersJson"></textarea></label>
                  <label class="json-field">Token Activate Body <textarea name="tokenActivateBodyJson"></textarea></label>
                  <label class="json-field">Token Refresh Headers <textarea name="tokenRefreshHeadersJson"></textarea></label>
                  <label class="json-field">Token Refresh Body <textarea name="tokenRefreshBodyJson"></textarea></label>
                </div>
              </div>
              <div class="form-actions">
                <button class="primary btn-large" type="submit">🚀 Execute Lobby Flow</button>
              </div>
            </form>
          </section>

          <section id="maintenance-panel" class="panel">
            <form id="maintenance-form" class="flow-form">
              <div class="card">
                <h3>Admin Target</h3>
                <div class="control-grid maintenance-grid">
                  <label>API domain <input name="apiDomain" autocomplete="off"></label>
                  <label>Signature <input name="signature" autocomplete="off"></label>
                  <label>Game code <input name="gameCode" autocomplete="off"></label>
                  <label>User ID <input name="userId" autocomplete="off"></label>
                  <label>Account <input name="account" autocomplete="off"></label>
                  <label>Code <input name="code" autocomplete="off"></label>
                  <label>Route key <input name="routeKey" autocomplete="off"></label>
                  <label class="toggle-row">
                    <span>Is Maintenance?</span>
                    <input name="isMaintenance" type="checkbox">
                  </label>
                </div>
              </div>
              <div class="card">
                <h3>Payloads & Headers</h3>
                <div class="control-grid json-grid">
                  <label class="json-field">AM Token Headers <textarea name="amTokenHeadersJson"></textarea></label>
                  <label class="json-field">AM Token Body <textarea name="amTokenBodyJson"></textarea></label>
                  <label class="json-field">Maintenance Headers <textarea name="maintenanceHeadersJson"></textarea></label>
                  <label class="json-field">Maintenance Body <textarea name="maintenanceBodyJson"></textarea></label>
                </div>
              </div>
              <div class="form-actions">
                <button class="primary btn-large" type="submit">🛡️ Run Maintenance Command</button>
              </div>
            </form>
          </section>
        </div>

        <div class="workspace-column">
          <div class="workspace">
            <div class="output-panel">
              <div class="section-title">
                <h2>JSON Result</h2>
                <span id="result-file" class="text-xs"></span>
              </div>
              <pre id="result-output">{}</pre>
            </div>
            <div class="output-panel">
              <div class="section-title">
                <h2>Flow Trace Logs</h2>
              </div>
              <pre id="trace-output">[]</pre>
            </div>
          </div>

          <section class="records-panel card mt-4">
            <div class="section-title border-none">
              <h2>Recent Executions</h2>
              <span class="text-xs">Latest 10</span>
            </div>
            <div id="records-list" class="records-list"></div>
          </section>
        </div>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
