<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slot API Test Console</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    
    <div id="state-modal" class="modal-overlay">
      <div class="modal-content" style="max-width: 600px; height: 70vh;">
        <div class="modal-header">
          <h2 style="color: #38bdf8;">{ x } Variables / Runtime State</h2>
          <button type="button" class="modal-close" id="btn-close-state">&times;</button>
        </div>
        <div class="modal-body" style="display: flex; flex-direction: column; padding: 0;">
          <p class="text-xs" style="color:var(--muted); padding: 16px; margin: 0; background: var(--panel); border-bottom: 1px solid var(--line);">
            State populated from execution steps can be edited here directly and passed to subsequent requests.
          </p>
          <textarea id="runtime-state" class="state-editor" placeholder="{}" style="flex: 1; padding: 16px; margin: 0; border: none; border-radius: 0;"></textarea>
        </div>
      </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
      <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
          <h2>⚙️ UI Settings</h2>
          <button type="button" class="modal-close" id="btn-close-settings">&times;</button>
        </div>
        <div class="modal-body">
          <div class="card">
            <h3>Steps Layout Mode</h3>
            <div class="control-grid">
              <label class="toggle-row"><input type="radio" name="layoutMode" value="showall"> <span>Show All</span></label>
              <label class="toggle-row"><input type="radio" name="layoutMode" value="vertical"> <span>Vertical Tabs</span></label>
              <label class="toggle-row"><input type="radio" name="layoutMode" value="horizontal" checked> <span>Horizontal Tabs (Default)</span></label>
            </div>
            <div class="control-grid" style="margin-top: 8px;">
              <label class="toggle-row"><input type="checkbox" id="setting-trim-tabs"> <span>Trim long tab labels (uncheck to show full text)</span></label>
            </div>
          </div>
          <div class="card mt-4" style="flex-shrink: 0;">
            <h3>Recent Executions Limit</h3>
            <div class="control-grid">
              <label>History Limit (Flow Storage) <input type="number" id="setting-history-limit" value="100" min="10" max="500"></label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <main class="app-shell">
      <header class="topbar">
        <h1>API Console</h1>

        <div class="backend-env-widget">
          <div class="backend-tabs">
            <label class="env-pill"><input type="radio" name="envType" value="LOCAL"><span>LOCAL</span></label>
            <label class="env-pill"><input type="radio" name="envType" value="CIT" checked><span>CIT</span></label>
            <label class="env-pill"><input type="radio" name="envType" value="QAT"><span>QAT</span></label>
          </div>
          <input type="text" id="global-domain" name="apiDomain" placeholder="https://letsgo-rgs-gs1.iki-cit.cc" autocomplete="off">
          <div id="healthcheck-status" class="health-status">...</div>
          <div class="v-divider"></div>
          <input id="global-signature" autocomplete="off" placeholder="Signature">
          <input id="global-gamecode" autocomplete="off" placeholder="Game Code">
        </div>

        <div class="topbar-actions">
          <button id="btn-open-state" class="btn-settings" style="color:#38bdf8; border-color:#38bdf8;">{ x } Variables</button>
          <button id="btn-open-settings" class="btn-settings">⚙️ Settings</button>
          <button id="btn-clear-cache" class="btn-settings cache-btn">🗑️ Clear Cache</button>
          <div id="status" class="status badge idle">Idle</div>
        </div>
      </header>

      <div class="tabs-nav-row">
        <nav class="tabs" id="flow-tabs" aria-label="Flow tabs"><!-- tabs rendered from /api/flows --></nav>
        <div class="nav-actions">
          <div class="recent-wrapper" id="cache-wrapper">
            <button id="btn-toggle-cache" class="btn-settings" style="border-color: #10b981; color: #10b981;">💾 Flow Cache ▼</button>
            <div id="cache-dropdown" class="records-dropdown">
              <div id="backend-cache-content" style="padding:0; overflow:auto;">{}</div>
            </div>
          </div>
          <div class="recent-wrapper">
            <button id="btn-toggle-recent" class="btn-settings" style="border-color: #10b981; color: #10b981;">🕘 Recent Executions ▼</button>
            <div id="recent-dropdown" class="records-dropdown">
              <div id="records-list" class="records-list-vertical"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="content-layout">
        
        <div class="controls-column scrollable" id="controls-column">
        </div>

        <div class="main-splitter" id="main-splitter"></div>

        <div class="workspace-column" id="workspace-column">
          <div class="output-container card">
            <div class="workspace-tabs">
              <button type="button" class="ws-tab is-active" data-ws="result">JSON Result</button>
              <button type="button" class="ws-tab" data-ws="trace">Trace Logs</button>
              <span id="result-file" class="text-xs ml-auto"></span>
            </div>
            <div class="workspace-content">
              <div id="ws-result" class="ws-panel is-active"><pre id="result-output" tabindex="0">{}</pre></div>
              <div id="ws-trace" class="ws-panel">
                </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
